<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5c45">
  <meta name="apple-mobile-web-app-title" content="食堂收货M1">
  <title>武汉大功率机车检修段食堂收货管理系统M1</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/logo-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn top-back" id="back-btn" type="button" aria-label="返回" hidden>‹</button>
    <span class="brand-credit">QuanYangYang制作 · 引用请注明</span>
    <button class="top-location" id="top-location" type="button" data-action="settings">收货地点：<span id="top-location-code">未设置</span></button>
    <span id="top-title" class="sr-only"></span><span id="top-sub" class="sr-only"></span>
  </header>

  <div id="update-bar" class="update-bar" hidden>
    <span id="update-text">发现新版本</span>
    <button class="btn tiny primary" type="button" data-action="apply-update">立即更新</button>
    <button class="icon-btn" type="button" data-action="dismiss-update" aria-label="关闭">×</button>
  </div>

  <main id="view" class="view"></main>
  <footer class="app-footer">
    <div class="browser-list">
      <span>推荐浏览器</span>
      <span>Safari（iPhone）</span>
      <span>Chrome（Android）</span>
      <span>Edge（Windows/Android）</span>
    </div>
    <div class="footer-note">微信内置浏览器可能不支持完整相机/相册/导出功能。</div>
    <div class="footer-note">武汉大功率机车检修段食堂收货管理系统M1 · QuanYangYang制作</div>
  </footer>

  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>
  <div id="busy" class="busy" hidden><div class="spinner"></div><span id="busy-text">处理中…</span></div>

  <input id="file-note" type="file" accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <input id="file-zip" type="file" accept=".zip,application/zip" hidden>
  <input id="file-photo" type="file" accept="image/*" multiple hidden>
  <input id="file-camera" type="file" accept="image/*" capture="environment" hidden>

  <script src="vendor/cpexcel.js"></script>
  <script src="vendor/xlsx.bundle.js"></script>
  <script src="vendor/fflate.umd.js"></script>
  <script src="parser.js"></script>
  <script src="workbook.js"></script>
  <script src="app.js"></script>
</body>
</html>

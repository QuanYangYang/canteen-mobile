<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5c45">
  <title>食堂收货拍照</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="back-btn" type="button" aria-label="返回" hidden>‹</button>
    <div class="topbar-title">
      <strong id="top-title">食堂收货</strong>
      <span id="top-sub"></span>
    </div>
    <button class="icon-btn" id="settings-btn" type="button" aria-label="设置">⚙</button>
  </header>

  <main id="view" class="view"></main>

  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>
  <div id="busy" class="busy" hidden><div class="spinner"></div><span id="busy-text">处理中…</span></div>

  <input id="file-note" type="file" accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <input id="file-zip" type="file" accept=".zip,application/zip" hidden>
  <input id="file-photo" type="file" accept="image/*" multiple hidden>
  <input id="file-camera" type="file" accept="image/*" capture="environment" hidden>

  <script src="vendor/cpexcel.js"></script>
  <script src="vendor/xlsx.bundle.js"></script>
  <script src="vendor/fflate.umd.js"></script>
  <script src="parser.js"></script>
  <script src="workbook.js"></script>
  <script src="app.js"></script>
</body>
</html>
